<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page Not Found (404) · Agnee 2026 | GSV Vadodara</title>
  <meta name="theme-color" content="#07050a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Creepster&family=Inter:wght@400;600;700&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="festival.css">
  <style>
    .notfound-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      text-align: center;
      background: radial-gradient(circle at 50% 40%, #2a1240, #07050a);
    }
    .notfound-card {
      max-width: 540px;
      padding: clamp(28px, 5vw, 48px);
    }
    .notfound-code {
      font-size: clamp(64px, 12vw, 96px);
      font-weight: 900;
      font-family: var(--font-mono);
      color: var(--gold-primary);
      line-height: 1;
      margin: 0 0 12px;
      text-shadow: 0 0 30px var(--gold-glow);
    }
    .notfound-title {
      font-size: clamp(22px, 3.5vw, 30px);
      color: #fff;
      margin: 0 0 14px;
    }
    .notfound-desc {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-secondary);
      margin: 0 0 28px;
    }
  </style>
</head>
<body>
  <div class="notfound-wrapper">
    <div class="notfound-card glass-panel">
      <div class="notfound-code">404</div>
      <h1 class="notfound-title">Lost on Campus?</h1>
      <p class="notfound-desc">
        The page or section you are looking for does not exist or has been relocated in the Agnee 2026 directory.
      </p>
      <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
        <a href="./index.html#home" class="btn-primary">
          Return to Festival Home
        </a>
        <a href="./index.html#map" class="btn-secondary">
          Open 3D Campus Map
        </a>
      </div>
    </div>
  </div>
</body>
</html>
