name: Agnee 2026 CI & Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Validate JSON Schemas
        run: |
          node -e "
            const fs = require('fs');
            const files = ['site.json', 'events.json', 'schedule.json', 'guests.json', 'sponsors.json', 'team.json', 'faqs.json', 'places.json'];
            files.forEach(f => {
              const content = fs.readFileSync('data/' + f, 'utf8');
              JSON.parse(content);
              console.log('✓ Valid JSON: data/' + f);
            });
          "

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Start Local HTTP Server & Run E2E Tests
        run: |
          npx serve . -p 8000 &
          sleep 3
          npx playwright test

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
